[platformio]
default_envs = esp32dev

[env:esp32dev]            ; ОСНОВНАЯ прошивка: ESP32 вместо iPad + веб-панель/API (Wi-Fi), будильники в NVS
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions_wul.csv  ; 2×1,94 МБ под OTA (было min_spiffs: 2×1,88) — смена только по USB
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED      ; BLE нужен только как периферия (приложение подключается к нам)
  -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -D LOG_LOCAL_LEVEL=0                           ; без строк ESP_LOGx библиотек (A2DP, NimBLE) — место во флеш
  -D WUL_NO_BLE        ; без NimBLE: его пулы — ~5,7 КБ ОЗУ, без них колонке (A2DP + SPP) не хватало памяти (2026-11-03)
build_src_filter = -<*> +<main.cpp> +<core/> +<wul/> +<iap/> +<net/> +<diag/> +<audio/> +<storage/>
extra_scripts = pre:tools/pio_embed_ui.py
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  h2zero/NimBLE-Arduino@^1.4.2
  earlephilhower/ESP8266Audio@1.9.7
  https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.12   ; Bluetooth-колонка (A2DP-приёмник)

[env:ota]                 ; та же прошивка, но заливка по Wi-Fi: pio run -e ota -t upload
extends = env:esp32dev
upload_protocol = espota
upload_port = wul.local
upload_flags = --auth=wakeuplight

[env:native]              ; хост-тесты кодека (pio test -e native)
platform = native
build_flags = -std=c++17 -I src/wul
test_framework = custom
